# adapted from xarray's ci
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect-skip-ci-trigger:
    name: "Detect CI Trigger: [skip-ci]"
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    outputs:
      triggered: ${{ steps.detect-trigger.outputs.trigger-found }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: xarray-contrib/ci-trigger@v1.2.1
        id: detect-trigger
        with:
          keyword: "[skip-ci]"

  ci:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: detect-skip-ci-trigger
    defaults:
      run:
        shell: bash -l {0}

    if: |
      always()
      && github.repository == 'calgray/astropy-xarray'
      && (
        github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        || (
          github.event_name == 'pull_request'
          && (
            needs.detect-skip-ci-trigger.outputs.triggered == 'false'
            && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
          )
        )
      )

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]

    env:
      FORCE_COLOR: 3
      RUNNER_OS: ${{ matrix.os }}

    steps:
      - name: checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          # need to fetch all tags to get a correct version
          fetch-depth: 0 # fetch all branches and tags
          persist-credentials: false

      - name: cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-py${{ matrix.python-version }}
          restore-keys: |
            pip-

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: install dependencies
        run: |
          python -m pip install ".[test]"

      - name: install astropy-xarray
        run: python -m pip install --no-deps .

      - name: show versions
        run: python -m pip list

      - name: import astropy-xarray
        run: |
          python -c 'import astropy_xarray'

      - name: run tests
        if: success()
        id: status
        run: |
          python -m pytest --cov=astropy_xarray --cov-report=xml

      - name: Upload code coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: "${{ secrets.CODECOV_TOKEN }}" # zizmor: ignore[secrets-outside-env] codecov token
          files: ./coverage.xml
          flags: unittests
          env_vars: RUNNER_OS,PYTHON_VERSION
          name: codecov-umbrella
          fail_ci_if_error: false
